# ============================================================
# MLB Scouting Report — Daily Pipeline + Deploy
# ============================================================
# Runs twice daily: morning preview (projected lineups) and
# afternoon update (official lineups + fresh game context).
#
# Schedules (UTC — baseball season runs EDT = UTC-4):
#   7:30 AM ET  →  11:30 UTC
#   4:30 PM ET  →  20:30 UTC
#
# Note: GitHub Actions scheduled runs can be delayed up to
#   30-60 min during high-traffic periods.
#
# Manual trigger: Actions tab → Daily MLB Report → Run workflow
# ============================================================

name: Daily MLB Report

on:
  schedule:
    - cron: "30 11 * * *"   #  7:30 AM ET (EDT = UTC-4)
    - cron: "30 20 * * *"   #  4:30 PM ET (EDT = UTC-4)
  workflow_dispatch:          # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # --------------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Install Quarto
      # --------------------------------------------------------
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # --------------------------------------------------------
      # 3. Install R
      # --------------------------------------------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      # --------------------------------------------------------
      # 4. Cache R package library (keyed to DESCRIPTION so any
      #    dependency change invalidates and rebuilds)
      # --------------------------------------------------------
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/Library
          key: r-pkgs-${{ runner.os }}-r4.4-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-pkgs-${{ runner.os }}-r4.4-

      # --------------------------------------------------------
      # 5. Install R packages
      #    - baseballr and Lahman from GitHub (CRAN versions
      #      have issues or stale data)
      #    - everything else from DESCRIPTION via remotes
      # --------------------------------------------------------
      - name: Install R dependencies
        run: |
          Rscript -e "
            options(repos = c(CRAN = 'https://packagemanager.posit.co/cran/__linux__/noble/latest'))
            install.packages('remotes', quiet = TRUE)
            remotes::install_github('BillPetti/baseballr', upgrade = 'never', quiet = TRUE)
            remotes::install_github('cdalzell/Lahman', upgrade = 'never', quiet = TRUE)
            remotes::install_deps('.', dependencies = FALSE, upgrade = 'never', quiet = TRUE)
          "

      # --------------------------------------------------------
      # 5. Prepare directories
      # --------------------------------------------------------
      - name: Ensure data, logs, and reports directories exist
        run: mkdir -p data logs reports

      # --------------------------------------------------------
      # 6. Base pipeline cache (season stats, refreshed weekly)
      # --------------------------------------------------------
      - name: Get ISO week number
        id: week
        run: echo "week=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Restore base pipeline cache
        id: base-cache
        uses: actions/cache@v4
        with:
          path: data/base_cache.rds
          key: base-cache-${{ runner.os }}-week-${{ steps.week.outputs.week }}
          restore-keys: |
            base-cache-${{ runner.os }}-week-

      - name: Bootstrap base cache from release (first run of the week)
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          gh release download cache-bootstrap \
            --pattern "base_cache.rds" \
            --dir data \
            --clobber 2>/dev/null \
            || echo "No bootstrap release found — run_all.R will do a full rebuild"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # 6b. Predictions log cache — data/predictions_log.csv is gitignored
      #     and each run starts from a fresh checkout, so without this it
      #     never accumulates history: log_predictions.R (called from
      #     run_pipeline_phase01.R) can never find a past prediction to
      #     backfill an actual score onto, and render_game_results.R
      #     (called from run_all.R) always sees zero completed games and
      #     silently renders nothing. Key includes run_id so every run
      #     saves a fresh snapshot (actions/cache won't overwrite an
      #     existing key); restore-keys prefix-matches the most recent
      #     prior snapshot regardless of which run created it.
      # --------------------------------------------------------
      - name: Restore predictions log cache
        uses: actions/cache@v4
        with:
          path: data/predictions_log.csv
          key: predictions-log-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            predictions-log-${{ runner.os }}-

      # --------------------------------------------------------
      # 7. Diagnostics — confirm which commit and code CI is using
      # --------------------------------------------------------
      - name: Verify source code
        run: |
          echo "=== Git commit ==="
          git log --oneline -1
          echo "=== 01_mlb_offense_season.R lines 82-87 ==="
          sed -n '82,87p' pipelines/05_performance/01_offense/01_mlb_offense_season.R

      # --------------------------------------------------------
      # 8. Run full pipeline and render all reports
      #    push_to_web.R is a no-op in CI (GITHUB_ACTIONS is set)
      # --------------------------------------------------------
      - name: Run pipeline and render reports
        run: |
          Rscript -e "
            setwd('${{ github.workspace }}')
            options(error = function() { traceback(3); quit(status = 1) })
            source('run_all.R')
          "

      # --------------------------------------------------------
      # Prune reports older than 21 days from gh-pages.
      # keep_files:true below means old dated reports accumulate
      # forever otherwise — the branch hit ~16.6GB in mid-June and
      # every GitHub Pages build has failed since (10GB artifact
      # limit), even though the git push itself kept succeeding.
      # Operates via the Git Data API directly (no checkout) since
      # the branch can be large; runs before the restore step below
      # so it never pulls pruned files back in.
      # --------------------------------------------------------
      - name: Prune reports older than 21 days from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          cutoff=$(date -d "21 days ago" +%Y-%m-%d)
          echo "Pruning gh-pages report files older than $cutoff"

          head_sha=$(gh api "repos/$REPO/git/refs/heads/gh-pages" --jq '.object.sha' 2>/dev/null || echo "")
          if [ -z "$head_sha" ]; then
            echo "No gh-pages branch yet — skipping prune"
            exit 0
          fi
          tree_sha=$(gh api "repos/$REPO/git/commits/$head_sha" --jq '.tree.sha')

          gh api "repos/$REPO/git/trees/$tree_sha?recursive=true" --paginate --jq \
            '.tree[] | select(.type=="blob") | .path' > /tmp/gh_pages_paths.txt

          python3 - "$cutoff" > /tmp/delete_paths.json <<'PYEOF'
          import json, re, sys
          cutoff = sys.argv[1]
          paths = []
          with open('/tmp/gh_pages_paths.txt') as f:
              for line in f:
                  p = line.rstrip('\n')
                  if not p:
                      continue
                  m = re.search(r'(\d{4}-\d{2}-\d{2})', p)
                  if m and m.group(1) < cutoff:
                      paths.append(p)
          print(json.dumps(paths))
          PYEOF

          n=$(python3 -c "import json; print(len(json.load(open('/tmp/delete_paths.json'))))")
          echo "Files to prune: $n"

          if [ "$n" -eq 0 ]; then
            echo "Nothing to prune"
            exit 0
          fi

          python3 - "$tree_sha" <<'PYEOF'
          import json, sys
          base_tree = sys.argv[1]
          paths = json.load(open('/tmp/delete_paths.json'))
          payload = {
              "base_tree": base_tree,
              "tree": [{"path": p, "mode": "100644", "type": "blob", "sha": None} for p in paths]
          }
          json.dump(payload, open('/tmp/new_tree_payload.json', 'w'))
          PYEOF

          new_tree=$(gh api -X POST "repos/$REPO/git/trees" --input /tmp/new_tree_payload.json --jq '.sha')
          new_commit=$(gh api -X POST "repos/$REPO/git/commits" \
            -f message="Prune reports older than 21 days from gh-pages [automated]" \
            -f tree="$new_tree" \
            -f "parents[]=$head_sha" \
            --jq '.sha')
          gh api -X PATCH "repos/$REPO/git/refs/heads/gh-pages" -f sha="$new_commit" -F force=false
          echo "Pruned $n files, new commit: $new_commit"

      # --------------------------------------------------------
      # 8. Pull existing gh-pages HTML into reports/ so the
      #    index page can link to past dates
      # --------------------------------------------------------
      - name: Restore past reports from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || echo "No gh-pages branch yet — skipping"
          if git cat-file -e FETCH_HEAD 2>/dev/null; then
            git worktree add /tmp/ghpages-old FETCH_HEAD 2>/dev/null
            find /tmp/ghpages-old -maxdepth 1 -name "*.html" ! -name "index.html" | while read f; do
              bn=$(basename "$f")
              [ -f "reports/$bn" ] && continue   # keep freshly rendered file
              cp "$f" "reports/$bn"
            done
            git worktree remove /tmp/ghpages-old --force 2>/dev/null || true
          fi

      # --------------------------------------------------------
      # 9. Generate index.html (needs full reports/ to list past games)
      # --------------------------------------------------------
      - name: Generate index page
        run: |
          Rscript -e "
            setwd('${{ github.workspace }}')
            source('generate_index.R')
          "

      # --------------------------------------------------------
      # 10. Deploy reports/ to GitHub Pages
      #     keep_files: true preserves older date files already
      #     on the branch (peaceiris only adds/overwrites, not deletes)
      # --------------------------------------------------------
      - name: Get report date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy MLB reports ${{ steps.date.outputs.date }}"
